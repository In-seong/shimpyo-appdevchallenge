plugins { id 'com.android.application' }

// 릴리스 서명 정보는 git 에 올리지 않는다 (keystore.properties, keystore/*.jks 는 .gitignore 대상)
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.mobiliteasy.shimpyo'
    compileSdk 35

    defaultConfig {
        applicationId "com.mobiliteasy.shimpyo"
        minSdk 28        // 공모전 개발 환경 요구사항: Android API 28 이상
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            if (keystoreProps['storeFile']) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProps['storeFile']) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    // kotlin-stdlib-jdk7/jdk8 는 1.8부터 본체(kotlin-stdlib)에 병합됐다.
    // 전이 의존성이 옛 버전을 끌고 오면 중복 클래스로 빌드가 깨진다.
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // 웹뷰는 android.webkit 표준 API만 쓴다 — androidx.webkit 불필요
}
